<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevOps Tools</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            min-height: 100vh;
            color: #fff;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 2rem;
        }
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-top: 2rem;
        }
        .tool-card {
            background: #2d2d2d;
            padding: 1.5rem;
            border-radius: 8px;
            text-align: center;
            transition: transform 0.3s;
        }
        .tool-card:hover {
            transform: translateY(-5px);
        }
        h1 {
            text-align: center;
            color: #00ff9d;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>DevOps Tools</h1>
        <div class="tools-grid">
            <div class="tool-card">
                <h3>Git</h3>
                <p>Version Control System</p>
            </div>
            <div class="tool-card">
                <h3>Jenkins</h3>
                <p>CI/CD Automation</p>
            </div>
            <div class="tool-card">
                <h3>Docker</h3>
                <p>Containerization</p>
            </div>
            <div class="tool-card">
                <h3>Kubernetes</h3>
                <p>Container Orchestration</p>
            </div>
        </div>
    </div>
</body>
</html>
